name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default — none of these jobs need to write anything.
permissions:
  contents: read

jobs:
  verify:
    name: Unit Tests & Code Standards (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both major versions declared in package.json's `engines` field —
        # a declared-but-unverified runtime is a gap, not a guarantee.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  integration:
    name: Live Integration Suite
    # Manual-only: Taiga Cloud's network/WAF blocks GitHub-hosted runner IP
    # ranges (confirmed via TCP-level ETIMEDOUT/ENETUNREACH on both IPv4 and
    # IPv6, while the same host is reachable from a regular network) — this
    # job cannot pass reliably from automatic CI, so it no longer gates
    # pushes to main. Run it manually (workflow_dispatch) from a network
    # Taiga will actually accept connections from, or run
    # `pnpm test:integration` locally.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: integration-test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:integration
        env:
          TAIGA_TEST_BASE_URL: ${{ secrets.TAIGA_TEST_BASE_URL }}
          TAIGA_TEST_TOKEN: ${{ secrets.TAIGA_TEST_TOKEN }}
          TAIGA_TEST_USERNAME: ${{ secrets.TAIGA_TEST_USERNAME }}
          TAIGA_TEST_PASSWORD: ${{ secrets.TAIGA_TEST_PASSWORD }}
          TAIGA_TEST_PROJECT_SLUG: ${{ secrets.TAIGA_TEST_PROJECT_SLUG }}
